[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-x"
version = "0.1.0"
description = "Asistente personal local de IA con memoria, investigacion web y voz opcional."
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4==4.12.3",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "jinja2==3.1.5",
    "argon2-cffi==23.1.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper==1.1.0",
    "sounddevice==0.5.1",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.9.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
